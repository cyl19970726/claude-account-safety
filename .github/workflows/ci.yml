name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Secret scan
        run: python scripts/secret_check.py --root .
      - name: Syntax checks
        run: |
          bash -n install.sh package.sh
          python -m py_compile scripts/*.py tests/*.py
      - name: Read-only inventory
        run: python scripts/doctor.py --summary
      - name: Package
        run: bash package.sh
